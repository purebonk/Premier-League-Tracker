name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Tests run against PGlite -- real Postgres compiled to WASM -- applying
      # the committed migrations. No database service, no secrets, so this
      # passes on a fork PR exactly as it does on main.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build only needs a syntactically valid URL; no page is
          # prerendered against real data.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
